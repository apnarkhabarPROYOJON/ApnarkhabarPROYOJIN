<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title id="ttl">প্রয়োজন</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style id="css">
/* Layout: one narrow column like a printed menu board; dotted leaders join dish to price; a fixed bar carries the cart total. */
:root {
  --bg: #f3f5ef;
  --surface: #ffffff;
  --ink: #17241d;
  --muted: #5a6a60;
  --line: #dde3d8;
  --accent: #1e6b47;
  --accent-ink: #ffffff;
  --turmeric: #e2a21b;
  --danger: #b3261e;
  --font-display: "Anek Bangla", "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --font-body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101813; --surface: #18231c; --ink: #e8efe9; --muted: #9baaa0; --line: #2a382f;
    --accent: #4dbb88; --accent-ink: #0b1a12; --turmeric: #f0b13a; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101813; --surface: #18231c; --ink: #e8efe9; --muted: #9baaa0; --line: #2a382f;
  --accent: #4dbb88; --accent-ink: #0b1a12; --turmeric: #f0b13a; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 120px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.25; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }

.head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-bottom: 18px; border-bottom: 3px double var(--line); }
.head h1 { font-size: 2rem; font-weight: 800; }
.head .sub { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
.kicker { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 1rem; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px; color: var(--muted); }

.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.item .top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.item .name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.item .dots { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.item .price { font-family: var(--font-display); font-weight: 800; color: var(--accent); white-space: nowrap; }
.item .desc { grid-column: 1; color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
.item .act { grid-column: 2; grid-row: 1 / span 2; }
.item.off .name, .item.off .price { color: var(--muted); text-decoration: line-through; }
.tag-off { color: var(--danger); font-weight: 600; font-size: 0.9rem; }

.add { background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); border-radius: 12px; min-height: 44px; padding: 6px 16px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); }
.stepper button { width: 44px; height: 44px; border: 0; background: none; color: var(--accent); font-size: 1.4rem; font-weight: 700; }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.bar .sum { line-height: 1.3; }
.bar .sum b { font-family: var(--font-display); font-size: 1.2rem; }
.bar .sum span { color: var(--muted); font-size: 0.9rem; display: block; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; min-height: 48px; padding: 8px 20px; font-weight: 600; font-family: var(--font-display); font-size: 1.05rem; }
.primary[disabled] { opacity: 0.45; cursor: not-allowed; }
.link-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; min-height: 48px; padding: 8px 20px; font-weight: 600; }

.empty { color: var(--muted); padding: 28px 0; }
.sec { margin-top: 24px; }
.sec h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
.lines { list-style: none; padding: 0; margin: 0; }
.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
.lines li span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines .total { font-weight: 700; font-family: var(--font-display); border-bottom: 0; font-size: 1.15rem; padding-top: 12px; }

label.f { display: block; margin-top: 14px; font-weight: 500; }
label.f small { color: var(--muted); font-weight: 400; }
input[type="text"], input[type="tel"], input[type="number"], textarea {
  width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
}
textarea { min-height: 76px; resize: vertical; }
.pay { display: grid; gap: 8px; margin-top: 8px; }
.pay label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 48px; }
.pay input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.pay label.sel { border-color: var(--accent); }
.note { background: var(--surface); border-left: 4px solid var(--turmeric); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
.note b { font-family: var(--font-display); }
.copyline { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.mono { font-variant-numeric: tabular-nums; user-select: all; font-weight: 600; }
.err { color: var(--danger); margin-top: 10px; font-weight: 500; }
.ok { color: var(--accent); margin-top: 10px; font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.row > * { flex: 1 1 160px; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 44px; }

.arow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; background: var(--surface); }
.arow .two { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; }
.arow label.chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-height: 44px; }
.arow label.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.del { background: none; border: 0; color: var(--danger); font-weight: 600; min-height: 44px; padding: 0 4px; }
.arow .foot { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<script id="data" type="application/json">{"shop": "প্রয়োজন", "wa": "", "pay": "", "fee": 0, "updated": "", "items": []}</script>
<div id="app"><p style="padding:24px 16px;color:var(--muted)">মেনু লোড হচ্ছে...</p></div>
<script id="code">
(function () {
  var bn = function (s) { return String(s).replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); };
  var money = function (n) { return '৳' + bn(n); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  var days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
  function todayLabel() { var d = new Date(); return days[d.getDay()] + ', ' + bn(d.getDate()) + ' ' + months[d.getMonth()]; }

  var DATA;
  try { DATA = JSON.parse(document.getElementById('data').textContent); } catch (e) { DATA = { shop: 'আপনার দোকানের নাম', wa: '', pay: '', fee: 0, updated: '', items: [] }; }

  var app = document.getElementById('app');
  var state = { view: 'menu', cart: {}, owner: false, form: { name: '', phone: '', addr: '', note: '', method: 'cod', trx: '' }, err: '', order: null, draft: null, adminMsg: '' };
  var focusSel = null;

  try { var saved = JSON.parse(localStorage.getItem('menu-cust') || '{}'); ['name', 'phone', 'addr'].forEach(function (k) { if (saved[k]) state.form[k] = saved[k]; }); } catch (e) {}

  function normPhone(p) {
    var d = String(p).replace(/[০-৯]/g, function (c) { return '০১২৩৪৫৬৭৮৯'.indexOf(c); }).replace(/\D/g, '');
    if (d.indexOf('880') === 0) d = d.slice(2);
    if (d.length === 10 && d[0] === '1') d = '0' + d;
    return d;
  }
  var validBD = function (d) { return /^01[3-9]\d{8}$/.test(d); };
  function waNum(p) { var d = normPhone(p); return validBD(d) ? '88' + d : String(p).replace(/\D/g, ''); }

  function cartLines() {
    return DATA.items.filter(function (it) { return it.on && state.cart[it.id] > 0; }).map(function (it) { return { it: it, q: state.cart[it.id] }; });
  }
  function totals() {
    var lines = cartLines(), cnt = 0, sub = 0;
    lines.forEach(function (l) { cnt += l.q; sub += l.q * l.it.price; });
    var fee = lines.length ? Number(DATA.fee) || 0 : 0;
    return { lines: lines, cnt: cnt, sub: sub, fee: fee, total: sub + fee };
  }

  function head() {
    var upd = DATA.updated ? 'হালনাগাদ: ' + esc(DATA.updated) : esc(todayLabel());
    return '<header class="head"><div><div class="kicker">আজকের মেনু</div><h1>' + esc(DATA.shop) + '</h1><div class="sub">' + upd + '</div></div>' +
      (state.owner ? '<button class="ghost" data-act="admin">মেনু সম্পাদনা</button>' : '') + '</header>';
  }

  function menuView() {
    var t = totals();
    var list = DATA.items.length ? '<ul class="items">' + DATA.items.map(function (it) {
      var q = state.cart[it.id] || 0, act;
      if (!it.on) act = '<span class="tag-off">আজ নেই</span>';
      else if (q > 0) act = '<div class="stepper"><button data-act="dec" data-id="' + it.id + '" aria-label="কমান">−</button><output>' + bn(q) + '</output><button data-act="inc" data-id="' + it.id + '" aria-label="বাড়ান">+</button></div>';
      else act = '<button class="add" data-act="inc" data-id="' + it.id + '">যোগ করুন</button>';
      return '<li class="item' + (it.on ? '' : ' off') + '"><div class="top"><span class="name">' + esc(it.name) + '</span><span class="dots"></span><span class="price">' + money(it.price) + '</span></div>' +
        (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : '<div></div>') + '<div class="act">' + act + '</div></li>';
    }).join('') + '</ul>' : '<p class="empty">আজকের মেনু এখনো দেওয়া হয়নি।</p>';
    var bar = '<div class="bar"><div class="bar-in"><div class="sum"><b>' + money(t.sub) + '</b><span>' + (t.cnt ? bn(t.cnt) + ' পিস নির্বাচিত' : 'কিছু নির্বাচন করুন') + '</span></div>' +
      '<button class="primary" data-act="checkout"' + (t.cnt ? '' : ' disabled') + '>অর্ডার করুন</button></div></div>';
    return '<div class="wrap">' + head() + list + '</div>' + bar;
  }

  function checkoutView() {
    var t = totals(), f = state.form;
    var advOk = !!DATA.pay;
    var lines = t.lines.map(function (l) { return '<li><span>' + bn(l.q) + ' × ' + esc(l.it.name) + '</span><span>' + money(l.q * l.it.price) + '</span></li>'; }).join('');
    var pay = '<div class="pay" role="radiogroup" aria-label="পেমেন্ট পদ্ধতি">' +
      '<label class="' + (f.method === 'cod' ? 'sel' : '') + '"><input type="radio" name="method" value="cod"' + (f.method === 'cod' ? ' checked' : '') + '> ক্যাশ অন ডেলিভারি</label>' +
      (advOk ? '<label class="' + (f.method === 'adv' ? 'sel' : '') + '"><input type="radio" name="method" value="adv"' + (f.method === 'adv' ? ' checked' : '') + '> অগ্রিম পেমেন্ট (বিকাশ / নগদ)</label>' : '') + '</div>';
    var adv = (f.method === 'adv' && advOk) ? '<div class="note"><b>অগ্রিম পেমেন্ট</b><br>' + money(t.total) + ' টাকা সেন্ড মানি করুন এই নম্বরে:' +
      '<div class="copyline"><span class="mono">' + esc(DATA.pay) + '</span><button class="ghost" data-act="copypay">কপি</button></div></div>' +
      '<label class="f" for="f-trx">ট্রানজেকশন আইডি (TrxID)<input id="f-trx" type="text" autocomplete="off" value="' + esc(f.trx) + '"></label>' : '';
    return '<div class="wrap"><button class="back" data-act="back">← মেনুতে ফিরুন</button><h2 style="font-size:1.6rem;font-weight:800">আপনার অর্ডার</h2>' +
      '<div class="sec"><ul class="lines">' + lines + '<li><span>ডেলিভারি চার্জ</span><span>' + money(t.fee) + '</span></li><li class="total"><span>মোট</span><span>' + money(t.total) + '</span></li></ul></div>' +
      '<div class="sec"><h2>আপনার তথ্য</h2>' +
      '<label class="f" for="f-name">নাম<input id="f-name" type="text" autocomplete="name" value="' + esc(f.name) + '"></label>' +
      '<label class="f" for="f-phone">মোবাইল নম্বর<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" value="' + esc(f.phone) + '"></label>' +
      '<label class="f" for="f-addr">ডেলিভারির ঠিকানা<textarea id="f-addr" autocomplete="street-address">' + esc(f.addr) + '</textarea></label>' +
      '<label class="f" for="f-note">নোট <small>(ঐচ্ছিক)</small><input id="f-note" type="text" value="' + esc(f.note) + '"></label></div>' +
      '<div class="sec"><h2>পেমেন্ট</h2>' + pay + adv + '</div>' +
      (state.err ? '<p class="err" role="alert">' + esc(state.err) + '</p>' : '') +
      '<div class="row"><button class="primary" data-act="submit">অর্ডার নিশ্চিত করুন</button></div></div>';
  }

  function buildMsg(o) {
    var L = ['নতুন অর্ডার #' + o.id, 'নাম: ' + o.name, 'ফোন: ' + bn(o.phone), 'ঠিকানা: ' + o.addr, '', 'আইটেম:'];
    o.lines.forEach(function (l) { L.push(bn(l.q) + ' × ' + l.it.name + ' = ' + money(l.q * l.it.price)); });
    L.push('', 'সাবটোটাল: ' + money(o.sub), 'ডেলিভারি: ' + money(o.fee), 'মোট: ' + money(o.total));
    L.push('পেমেন্ট: ' + (o.method === 'adv' ? 'অগ্রিম (TrxID: ' + o.trx + ')' : 'ক্যাশ অন ডেলিভারি'));
    if (o.note) L.push('নোট: ' + o.note);
    return L.join('\n');
  }

  function doneView() {
    var o = state.order, msg = buildMsg(o), num = waNum(DATA.wa);
    var link = num ? 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg) : '';
    return '<div class="wrap"><header class="head"><div><div class="kicker">অর্ডার তৈরি হয়েছে</div><h1>#' + esc(o.id) + '</h1><div class="sub">মোট ' + money(o.total) + ' · ' + (o.method === 'adv' ? 'অগ্রিম পেমেন্ট' : 'ক্যাশ অন ডেলিভারি') + '</div></div></header>' +
      '<div class="note"><b>শেষ ধাপ বাকি আছে।</b><br>নিচের বাটনে চাপ দিয়ে WhatsApp খুলুন, তারপর Send চাপুন। Send করলেই অর্ডার দোকানে পৌঁছাবে।</div>' +
      '<div class="row">' + (link ? '<a class="primary link-btn" href="' + esc(link) + '" target="_blank" rel="noopener">WhatsApp-এ অর্ডার পাঠান</a>' : '<p class="err">দোকানের WhatsApp নম্বর এখনো সেট করা হয়নি। নিচের মেসেজ কপি করে দোকানে পাঠান।</p>') +
      '<button class="secondary" data-act="copymsg">মেসেজ কপি করুন</button></div>' +
      '<div class="sec"><h2>আপনার অর্ডার</h2><ul class="lines">' + o.lines.map(function (l) { return '<li><span>' + bn(l.q) + ' × ' + esc(l.it.name) + '</span><span>' + money(l.q * l.it.price) + '</span></li>'; }).join('') + '</ul>' +
      '<p style="color:var(--muted);white-space:pre-wrap;margin-top:12px" id="msgtxt">' + esc(msg) + '</p></div>' +
      '<div class="row"><button class="ghost" data-act="newOrder">নতুন অর্ডার করুন</button></div></div>';
  }

  function adminView() {
    var d = state.draft;
    var rows = d.items.map(function (it, i) {
      return '<div class="arow" data-i="' + i + '"><label class="f" style="margin-top:0">খাবারের নাম<input type="text" class="a-name" value="' + esc(it.name) + '"></label>' +
        '<div class="two"><label class="f">বিবরণ<input type="text" class="a-desc" value="' + esc(it.desc) + '"></label><label class="f">দাম (৳)<input type="number" inputmode="numeric" min="0" class="a-price" value="' + esc(it.price) + '"></label></div>' +
        '<div class="foot"><label class="chk"><input type="checkbox" class="a-on"' + (it.on ? ' checked' : '') + '> আজ পাওয়া যাবে</label><button class="del" data-act="adel" data-i="' + i + '">মুছুন</button></div></div>';
    }).join('');
    return '<div class="wrap"><button class="back" data-act="aback">← বাতিল করে ফিরুন</button><h2 style="font-size:1.6rem;font-weight:800">মেনু সম্পাদনা</h2>' +
      '<div class="sec"><h2>দোকানের তথ্য</h2>' +
      '<label class="f" for="a-shop">দোকানের নাম<input id="a-shop" type="text" value="' + esc(d.shop) + '"></label>' +
      '<label class="f" for="a-wa">WhatsApp নম্বর <small>(অর্ডার এই নম্বরে আসবে)</small><input id="a-wa" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" value="' + esc(d.wa) + '"></label>' +
      '<label class="f" for="a-pay">বিকাশ / নগদ নম্বর <small>(অগ্রিম পেমেন্টের জন্য, না দিলে শুধু ক্যাশ অন ডেলিভারি থাকবে)</small><input id="a-pay" type="tel" inputmode="tel" value="' + esc(d.pay) + '"></label>' +
      '<label class="f" for="a-fee">ডেলিভারি চার্জ (৳)<input id="a-fee" type="number" inputmode="numeric" min="0" value="' + esc(d.fee) + '"></label></div>' +
      '<div class="sec"><h2>আজকের খাবার</h2>' + rows + '<div class="row"><button class="secondary" data-act="aadd">+ নতুন খাবার যোগ করুন</button></div></div>' +
      (state.adminMsg ? '<p class="' + (state.adminMsg.indexOf('!') > -1 ? 'ok' : 'err') + '" role="status">' + esc(state.adminMsg) + '</p>' : '') +
      '<div class="row"><button class="primary" data-act="apublish">menu.json ডাউনলোড করুন</button></div>' +
      '<p style="color:var(--muted);font-size:0.9rem">ডাউনলোড হওয়া menu.json ফাইলটা GitHub রিপোজিটরিতে আপলোড করে একই নামের পুরনো ফাইল বদলে দিলে নতুন মেনু সবার কাছে দেখাবে। আপলোডের আগে এই পরিবর্তন কাস্টমাররা দেখতে পাবে না।</p></div>';
  }

  function render() {
    app.innerHTML = state.view === 'menu' ? menuView() : state.view === 'checkout' ? checkoutView() : state.view === 'done' ? doneView() : adminView();
    if (focusSel) { var el = app.querySelector(focusSel); if (el) el.focus(); focusSel = null; }
  }

  function readForm() {
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : null; };
    var f = state.form;
    if (g('f-name') !== null) f.name = g('f-name');
    if (g('f-phone') !== null) f.phone = g('f-phone');
    if (g('f-addr') !== null) f.addr = g('f-addr');
    if (g('f-note') !== null) f.note = g('f-note');
    if (g('f-trx') !== null) f.trx = g('f-trx');
  }

  function syncAdmin() {
    var d = state.draft, g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    d.shop = g('a-shop'); d.wa = g('a-wa'); d.pay = g('a-pay'); d.fee = Number(g('a-fee')) || 0;
    app.querySelectorAll('.arow').forEach(function (r) {
      var it = d.items[Number(r.getAttribute('data-i'))];
      if (!it) return;
      it.name = r.querySelector('.a-name').value; it.desc = r.querySelector('.a-desc').value;
      it.price = Number(r.querySelector('.a-price').value) || 0; it.on = r.querySelector('.a-on').checked;
    });
  }

  function copy(text, done) {
    var fallback = function () { var n = document.getElementById('msgtxt'); if (n) { var r = document.createRange(); r.selectNodeContents(n); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function publish() {
    syncAdmin();
    var d = state.draft;
    var data = { shop: d.shop.trim() || 'প্রয়োজন', wa: d.wa.trim(), pay: d.pay.trim(), fee: d.fee, updated: todayLabel(),
      items: d.items.filter(function (it) { return it.name.trim() && it.price > 0; }).map(function (it) { return { id: it.id, name: it.name.trim(), desc: it.desc.trim(), price: it.price, on: !!it.on }; }) };
    if (data.wa && !validBD(normPhone(data.wa)) && waNum(data.wa).length < 10) { state.adminMsg = 'WhatsApp নম্বরটি সঠিক নয়। 01XXXXXXXXX ফরম্যাটে দিন।'; render(); return; }
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'menu.json';
      document.body.appendChild(a); a.click(); a.remove();
      state.adminMsg = 'নতুন menu.json ফাইল ডাউনলোড হয়েছে! এটা GitHub-এ আপলোড করলে মেনু আপডেট হবে।';
    } catch (e) { state.adminMsg = 'ফাইল বানানো যায়নি। অন্য ব্রাউজারে চেষ্টা করুন।'; }
    render();
  }

  function submit() {
    readForm();
    var f = state.form, t = totals(), ph = normPhone(f.phone);
    if (!t.cnt) { state.err = 'আগে খাবার নির্বাচন করুন।'; return render(); }
    if (!f.name.trim()) { state.err = 'আপনার নাম লিখুন।'; return render(); }
    if (!validBD(ph)) { state.err = 'মোবাইল নম্বরটি সঠিক নয়। 01XXXXXXXXX ফরম্যাটে দিন।'; return render(); }
    if (!f.addr.trim()) { state.err = 'ডেলিভারির ঠিকানা লিখুন।'; return render(); }
    var method = (f.method === 'adv' && DATA.pay) ? 'adv' : 'cod';
    if (method === 'adv' && f.trx.trim().length < 6) { state.err = 'পেমেন্টের ট্রানজেকশন আইডি (TrxID) লিখুন।'; return render(); }
    try { localStorage.setItem('menu-cust', JSON.stringify({ name: f.name, phone: f.phone, addr: f.addr })); } catch (e) {}
    state.order = { id: Date.now().toString(36).slice(-5).toUpperCase(), name: f.name.trim(), phone: ph, addr: f.addr.trim(), note: f.note.trim(), method: method, trx: f.trx.trim(), lines: t.lines, sub: t.sub, fee: t.fee, total: t.total };
    state.err = ''; state.view = 'done'; window.scrollTo(0, 0); render();
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'inc') { state.cart[id] = (state.cart[id] || 0) + 1; focusSel = '[data-act="inc"][data-id="' + id + '"]'; render(); }
    else if (act === 'dec') { state.cart[id] = Math.max(0, (state.cart[id] || 0) - 1); focusSel = state.cart[id] ? '[data-act="dec"][data-id="' + id + '"]' : '[data-act="inc"][data-id="' + id + '"]'; render(); }
    else if (act === 'checkout') { state.view = 'checkout'; state.err = ''; window.scrollTo(0, 0); render(); }
    else if (act === 'back') { readForm(); state.view = 'menu'; render(); }
    else if (act === 'submit') submit();
    else if (act === 'newOrder') { state.cart = {}; state.order = null; state.form.trx = ''; state.form.note = ''; state.view = 'menu'; window.scrollTo(0, 0); render(); }
    else if (act === 'copymsg') { var o = state.order; copy(buildMsg(o), function () { b.textContent = 'কপি হয়েছে'; }); }
    else if (act === 'copypay') { copy(DATA.pay, function () { b.textContent = 'কপি হয়েছে'; }); }
    else if (act === 'admin') { state.draft = JSON.parse(JSON.stringify(DATA)); state.adminMsg = ''; state.view = 'admin'; window.scrollTo(0, 0); render(); }
    else if (act === 'aback') { state.view = 'menu'; render(); }
    else if (act === 'aadd') { syncAdmin(); state.draft.items.push({ id: 'i' + Date.now().toString(36), name: '', desc: '', price: 0, on: true }); render(); var rows = app.querySelectorAll('.arow .a-name'); if (rows.length) rows[rows.length - 1].focus(); }
    else if (act === 'adel') { syncAdmin(); state.draft.items.splice(Number(b.getAttribute('data-i')), 1); render(); }
    else if (act === 'apublish') publish();
  });

  app.addEventListener('change', function (e) {
    if (e.target.name === 'method') { readForm(); state.form.method = e.target.value; render(); }
  });

  render();

  fetch('menu.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { if (j && Array.isArray(j.items)) { DATA = j; if (state.view === 'menu') render(); } })
    .catch(function () { if (state.view === 'menu') render(); });
  function checkOwner() { var on = location.hash === '#admin'; if (on !== state.owner) { state.owner = on; if (state.view === 'menu') render(); } }
  window.addEventListener('hashchange', checkOwner);
  checkOwner();
})();
</script>
</body>
</html>
